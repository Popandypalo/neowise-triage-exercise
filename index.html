<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" aria-label="Результат разбора" hidden>
    <p>Тема: <span id="topic"></span></p>
    <h2>Черновик ответа</h2>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const submit = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Цены"],
      ["other", "Другое"],
    ]);
    const invalidInput = "Введите текст заявки.";
    const manualReview = "Нужен ручной разбор. Прочитайте заявку и подготовьте ответ самостоятельно.";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submit.disabled) return;

      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";

      const text = message.value;
      if (!text.trim()) {
        status.textContent = invalidInput;
        message.focus();
        return;
      }

      submit.disabled = true;
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();

        if (reply.status === 400 && data?.status === "invalid_input") {
          status.textContent = invalidInput;
          message.focus();
          return;
        }

        if (!reply.ok || data?.status !== "ready" || !topics.has(data.topic)
            || typeof data.draft !== "string" || !data.draft.trim()) {
          status.textContent = manualReview;
          return;
        }

        topic.textContent = topics.get(data.topic);
        draft.textContent = data.draft;
        result.hidden = false;
        status.textContent = "Черновик готов. Проверьте его перед отправкой.";
      } catch {
        status.textContent = manualReview;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
